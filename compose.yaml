services:
  node1:
    build: .
    command: ["-config", "/etc/raftgo/cluster.json", "-id", "node1"]
    ports: ["127.0.0.1:8001:8080"]
    volumes:
      - ./config/cluster.json:/etc/raftgo/cluster.json:ro
      - node1-data:/data
    restart: unless-stopped
    stop_grace_period: 15s
  node2:
    build: .
    command: ["-config", "/etc/raftgo/cluster.json", "-id", "node2"]
    ports: ["127.0.0.1:8002:8080"]
