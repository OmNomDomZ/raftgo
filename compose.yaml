name: raftgo-scenarios

services:
  node1:
    build: .
    command: ["-config", "/etc/raftgo/cluster.json", "-id", "node1", "-log-level", "debug"]
    ports: ["127.0.0.1:18001:8080"]
    volumes:
      - ./config/cluster.json:/etc/raftgo/cluster.json:ro
    stop_grace_period: 15s
